<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>AïDEA - Materials</title>
    <link rel="icon" href="media\logo.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Cairo', sans-serif; }
        body { background-color: #050505; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        #particles-js { position: fixed; width: 100%; height: 100%; z-index: 1; top: 0; left: 0; }
        nav, .materials-header, .materials-grid, footer { position: relative; z-index: 2; }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; flex-direction: row-reverse; background-color: rgba(0, 0, 0, 0.8); border-bottom: 1px solid #1a1a1a; backdrop-filter: blur(10px); }
        .logo img { height: 50px; width: auto; display: block; }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a { color: #fff; text-decoration: none; font-weight: 700; transition: 0.3s; font-size: 1.1rem; }
        .nav-links a:hover, .nav-links a.active { color: #F2EE14; text-shadow: 0 0 10px #f2ee14; }

        .materials-header { text-align: center; padding: 60px 20px 20px; }
        .header-title { font-size: 3rem; font-weight: 900; margin-bottom: 10px; }
        
        .search-box { position: relative; max-width: 500px; margin: 30px auto; }
        .search-box input { width: 100%; padding: 18px 55px 18px 25px; border-radius: 50px; border: 1px solid #333; background-color: rgba(17, 17, 17, 0.8); color: #fff; font-size: 1rem; outline: none; transition: 0.3s; }
        .search-box input:focus { border-color: #F2EE14; box-shadow: 0 0 20px rgba(242, 238, 20, 0.1); }
        .search-box i { position: absolute; right: 25px; top: 50%; transform: translateY(-50%); color: #F2EE14; font-size: 1.2rem; }

        .materials-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; padding: 20px 8%; flex: 1; }
        
        .material-card { 
            text-decoration: none; 
            color: white;
            background: rgba(15, 15, 15, 0.6); 
            border: 1px solid #222; 
            border-radius: 20px; 
            padding: 25px; 
            transition: 0.4s; 
            display: flex; 
            flex-direction: column; 
            backdrop-filter: blur(5px); 
            cursor: pointer;
        }
        .material-card:hover { transform: translateY(-10px); border-color: #F2EE14; box-shadow: 0 15px 30px rgba(0,0,0,0.5); background: rgba(20, 20, 20, 0.8); }
        
        .card-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .card-icon { font-size: 2rem; color: #F2EE14; }
        .card-title { font-size: 1.1rem; font-weight: 700; }
        
        .drive-indicator { margin-top: auto; background-color: rgba(255,255,255,0.05); color: #fff; padding: 12px; border-radius: 12px; text-align: center; font-weight: 700; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid #333; }
        .material-card:hover .drive-indicator { background-color: #F2EE14; color: #000; border-color: #F2EE14; }
        
        .material-card.graduation { border: 2px solid #F2EE14; background: linear-gradient(145deg, rgba(10,10,10,0.8), rgba(26,26,0,0.4)); }

        footer { text-align: center; padding: 40px; color: #555; background-color: #000; border-top: 1px solid #1a1a1a; }
        @media (max-width: 768px) { nav { padding: 20px; } .nav-links { gap: 15px; } }
    </style>
</head>
<body>
    <div id="particles-js"></div>

    <nav>
        <div class="logo"><img src="media\aidea_name_logo.png" alt="AïDEA Logo"></div>
        <div class="nav-links">
            <a href="index.html">الرئيسية</a>
            <a href="materials.html" class="active">المواد</a> 
            <a href="GPA.html">المعدل</a>
            <a href="StudyWithWiueni.html">ادرس مع Wiueni</a>
        </div>
    </nav>

    <div class="materials-header">
        <h1 class="header-title">مكتبة <span style="color: #F2EE14;">AïDEA</span></h1>
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن اسم المادة...">
        </div>
    </div>

    <div class="materials-grid" id="materialsContainer"></div>
    <div id="noResults" style="display:none; text-align:center; color:#555; position: relative; z-index: 2;">لا توجد مادة بهذا الاسم.</div>

    <footer>
        <p>&copy; 2026 جميع الحقوق محفوظة لفريق <span style="color:#F2EE14; font-weight:bold;">AïDEA</span>. ❤️</p>
    </footer>
<script src="data.js"></script>
    <script>
        const container = document.getElementById('materialsContainer');
        
        function renderMaterials() {
            container.innerHTML = materialsData.map(item => {
                let link = "#";
                if(item.mainId && item.mainId.trim() !== "") {
                    link = item.mainId.startsWith('http') ? item.mainId : `https://drive.google.com/drive/folders/${item.mainId}`;
                } else {
                    link = "javascript:void(0)"; 
                }

                
                const iconClass = item.icon.startsWith('fa-brands') ? item.icon : `fas ${item.icon}`;

                return `
                    <a href="${link}" target="_blank" rel="noopener noreferrer" class="material-card ${item.isGrad ? 'graduation' : ''}" ${link === "javascript:void(0)" ? 'style="opacity:0.6; cursor:default;"' : ''}>
                        <div class="card-header">
                            <div class="card-icon"><i class="${iconClass}"></i></div>
                            <h3 class="card-title">${item.title}</h3>
                        </div>
                        <div class="drive-indicator">
                            <i class="fas fa-folder-open"></i> فتح المادة
                        </div>
                    </a>
                `;
            }).join('');
        }
        renderMaterials();

        // Search Filter
        document.getElementById('searchInput').addEventListener('keyup', function() {
            let filter = this.value.toUpperCase();
            let cards = document.getElementsByClassName('material-card');
            let hasVisible = false;
            for (let card of cards) {
                let title = card.querySelector(".card-title").innerText;
                if (title.toUpperCase().indexOf(filter) > -1) { card.style.display = "flex"; hasVisible = true; } 
                else { card.style.display = "none"; }
            }
            document.getElementById('noResults').style.display = hasVisible ? "none" : "block";
        });

        particlesJS('particles-js', { "particles": { "number": { "value": 80 }, "color": { "value": "#F2EE14" }, "opacity": { "value": 0.3 }, "size": { "value": 3 }, "line_linked": { "enable": true, "color": "#F2EE14", "opacity": 0.15 }, "move": { "enable": true, "speed": 1 } } });
    </script>
</body>
</html>
