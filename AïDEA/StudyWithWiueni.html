<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>AïDEA - Study with Wiueni</title>
    <link rel="icon" href="media\logo.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Cairo', sans-serif; }
        
        body { 
            background-color: #050505; 
            color: #e2e8f0; 
            min-height: 100vh; 
            overflow-x: hidden; 
            transition: all 0.5s ease;
        }

        .login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(10px);
        }
        .login-box {
            background: rgba(20,20,20,0.8); padding: 40px; border-radius: 20px;
            border: 1px solid rgba(242, 238, 20, 0.2); text-align: center; width: 90%; max-width: 400px;

        }
        .login-title { font-size: 1.5rem; color: #F2EE14; margin-bottom: 20px; font-weight: bold; }
        .name-input {
            width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #333;
            background: #000; color: #fff; margin-bottom: 15px; text-align: center; font-size: 1.1rem; outline: none;
        }
        .pin-input {
            width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #333;
            background: #000; color: #fff; margin-bottom: 20px; text-align: center; font-size: 1.1rem; outline: none; letter-spacing: 5px;
        }
        .name-input:focus, .pin-input:focus { border-color: #F2EE14; }
        
        .login-btn {
            background: #F2EE14; color: #000; padding: 12px 30px; border-radius: 10px;
            border: none; font-weight: bold; cursor: pointer; font-size: 1.1rem; width: 100%;
            transition: 0.3s;
        }
        .login-btn:hover { background: #fff; transform: scale(1.02); }
        .login-note { font-size: 0.8rem; color: #888; margin-bottom: 20px; }

        body.zen-mode nav, body.zen-mode footer, body.zen-mode #particles-js, body.zen-mode .small-video-wrapper {
            opacity: 0; pointer-events: none;
        }
        .video-bg-container {

        nav {
            display: flex; justify-content: space-between; align-items: center; padding: 20px 50px;

        .nav-links a { color: #fff; text-decoration: none; font-weight: 700; transition: 0.3s; font-size: 1.1rem; }
        .nav-links a:hover, .nav-links a.active { color: #F2EE14; text-shadow: 0 0 10px #f2ee14; }

        .winnie-section { 
            display: flex; align-items: flex-start; justify-content: center; 
            gap: 40px; padding: 30px 8%; margin-top: 10px; position: relative; z-index: 10;
        }
        .small-video-wrapper {
            flex: 1; max-width: 420px; border-radius: 20px; overflow: hidden;
            border: 1px solid rgba(242, 238, 20, 0.2); box-shadow: 0 0 30px rgba(0,0,0,0.5);
            transition: opacity 0.5s; display: flex; flex-direction: column;
            background: rgba(20, 20, 20, 0.7); backdrop-filter: blur(15px);
        }

            position: fixed; bottom: 40px; right: 40px; top: auto; left: auto; transform: none;

        .user-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 0.9rem; color: #fff; }
        .user-name { color: #F2EE14; font-weight: bold; }
        .logout-btn { background: none; border: none; color: #888; cursor: pointer; font-size: 0.8rem; text-decoration: underline; }

        .total-stats {
            text-align: center; font-size: 0.9rem; color: #aaa; background: rgba(242, 238, 20, 0.08);

        .total-number { color: #F2EE14; font-weight: bold; font-family: monospace; font-size: 1rem; }

        .reset-btn:hover { color: #ff4444; }

        .timer-wrapper { position: relative; text-align: center; margin-bottom: 15px; }
        .timer-display { font-size: 4rem; font-weight: 800; color: #F2EE14; font-family: 'Poppins', monospace; text-shadow: 0 0 20px rgba(242, 238, 20, 0.3); line-height: 1; }
        .mute-btn { position: absolute; top: 50%; right: 10px; transform: translateY(-50%); background: transparent; border: none; color: rgba(255,255,255,0.3); cursor: pointer; font-size: 1.2rem; transition: 0.3s; }
        .mute-btn:hover { color: #fff; } .mute-btn.active { color: #ff6b6b; }

        .time-selector { margin-bottom: 15px; }

        .time-buttons { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .time-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 6px 12px; border-radius: 10px; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: all 0.3s ease; }
        .time-btn:hover { background: rgba(242, 238, 20, 0.1); border-color: #F2EE14; }
        .time-btn.active { background: #F2EE14; color: #000; border-color: #F2EE14; box-shadow: 0 4px 15px rgba(242, 238, 20, 0.3); }
        .test-btn { border-color: #ff4444 !important; color: #ff4444 !important; } .test-btn:hover { background: rgba(255, 68, 68, 0.2) !important; }

        .start-btn { width: 100%; background: #F2EE14; color: #000; border: none; padding: 12px; border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 1rem; margin-top: 10px; transition: all 0.3s ease; box-shadow: 0 5px 20px rgba(242, 238, 20, 0.3); }

        .tasks-container { margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        .tasks-title { font-size: 0.75rem; color: #F2EE14; margin-bottom: 8px; text-align: center; }
        .todo-input { width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; color: #fff; padding: 10px 12px; outline: none; text-align: right; font-size: 0.9rem; transition: all 0.3s ease; }
        .todo-input:focus { border-color: #F2EE14; }
        .todo-list { list-style: none; margin-top: 10px; max-height: 120px; overflow-y: auto; padding: 0; }
        .todo-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; margin-bottom: 5px; background: rgba(255, 255, 255, 0.02); border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); transition: all 0.2s; cursor: pointer; }
        .todo-item:hover { background: rgba(255,255,255,0.06); }
        .todo-content { display: flex; align-items: center; gap: 10px; flex-grow: 1; pointer-events: none; }
        .custom-checkbox { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-radius: 4px; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; flex-shrink: 0; }
        .custom-checkbox::after { content: '✓'; color: #000; font-size: 12px; font-weight: bold; opacity: 0; transition: all 0.3s ease; }
        .delete-btn { color: #ff6b6b; background: rgba(255, 107, 107, 0.1); border: none; cursor: pointer; font-size: 1.2rem; width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; z-index: 2; }
        .delete-btn:hover { background: rgba(255, 107, 107, 0.3); }
        .todo-item.completed span { text-decoration: line-through; color: #F2EE14; opacity: 0.8; }
        .todo-item.completed .custom-checkbox { background: #F2EE14; border-color: #F2EE14; }
        .todo-item.completed .custom-checkbox::after { opacity: 1; }
        .todo-item.completed { background: rgba(242, 238, 20, 0.08); border-color: rgba(242, 238, 20, 0.2); }

        .water-tracker { margin-top: 15px; text-align: center; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px; display: flex; align-items: center; justify-content: center; gap: 15px; }
        .water-cups { font-size: 1.1rem; color: #4fc3f7; font-weight: bold; }
        .add-water-btn { background: rgba(79, 195, 247, 0.15); color: #4fc3f7; border: 1px solid rgba(79, 195, 247, 0.3); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: all 0.3s ease; }
        .add-water-btn:hover { background: rgba(79, 195, 247, 0.3); }

        .leaderboard-section {
            padding: 20px;
        }
        .leaderboard-title {
            text-align: center; color: #fff; font-size: 1rem; font-weight: bold; margin-bottom: 15px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .leaderboard-list {
            list-style: none; padding: 0;
        }
        .lb-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px;
            margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }
        .lb-rank {
            font-weight: bold; width: 30px; text-align: center;
        }
        .lb-name { flex: 1; text-align: right; padding-right: 10px; font-weight: 600; }
        .lb-time { font-family: monospace; color: #aaa; font-size: 0.9rem; }
        
        .lb-item:nth-child(1) { border-color: #FFD700; background: rgba(255, 215, 0, 0.1); transform: scale(1.02); }
        .lb-item:nth-child(1) .lb-rank { color: #FFD700; font-size: 1.2rem; } 
        .lb-item:nth-child(2) { border-color: #C0C0C0; background: rgba(192, 192, 192, 0.1); }
        .lb-item:nth-child(2) .lb-rank { color: #C0C0C0; font-size: 1.1rem; }
        .lb-item:nth-child(3) { border-color: #CD7F32; background: rgba(205, 127, 50, 0.1); }
        .lb-item:nth-child(3) .lb-rank { color: #CD7F32; font-size: 1.1rem; }

        footer { text-align: center; padding: 25px; background: #000; margin-top: auto; position: relative; z-index: 20; transition: opacity 0.5s; }
        #particles-js { position: fixed; width: 100%; height: 100%; z-index: 1; top: 0; left: 0; }

        @media (max-width: 768px) {
            .winnie-section { flex-direction: column; align-items: center; padding: 20px 5%; }
            nav { padding: 15px; }
            .controls-panel { width: 100%; }
            body.zen-mode .controls-panel { width: 90%; bottom: 20px; right: 5%; }
            .timer-display { font-size: 3.5rem; }
        }
        #lockBtn { display: none; transition: 0.3s; }
    </style>
</head>
<body>

    <div id="loginOverlay" class="login-overlay">

            <input type="text" id="usernameInput" class="name-input" placeholder="Nickname (Example: Wiueni)" autocomplete="off">

            <button class="login-btn" onclick="loginUser()">ابدأ المنافسة 🚀</button>

        <section class="winnie-section">

                </div>

                    <div style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 8px;">
        <span class="time-selector-label" style="margin-bottom: 0;">اختر مدة الجلسة</span>
        <button id="lockBtn" onclick="toggleLock()" style="background: none; border: none; cursor: pointer; font-size: 1.2rem;">🔒</button>
    </div>
                    <div class="time-buttons">
                        <button class="time-btn test-btn" onclick="setTime(0.1)">TEST 6s</button>

        <footer>

    <script>
        // ---  إعدادات Firebase ---
        const firebaseConfig = {
  apiKey: "AIzaSyBFlEwYrWbjo2hBIU8UYbnEkOnym0RtVbE",
  authDomain: "aidea-474b3.firebaseapp.com",
  projectId: "aidea-474b3",
  storageBucket: "aidea-474b3.firebasestorage.app",
  messagingSenderId: "984197415809",
  appId: "1:984197415809:web:9cede5916b3edf90f11e80",
  measurementId: "G-KV3VVH5FKD"
};

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let timeLeft = 45 * 60; 
        let selectedTime = 45;
        let isTimerRunning = false; 
        let timerInterval = null; 
        let totalSecondsStudied = 0;
        let waterCount = 0;
        let isMuted = false;
        let currentUser = "";
        let docRef = null;

        const bgVideo = document.getElementById('bgVideo');

        window.onload = function() {
            const savedUser = localStorage.getItem('wiueni_global_user');
            if (savedUser) {
                currentUser = savedUser;
                initializeUser(currentUser);
                document.getElementById('loginOverlay').style.display = 'none';
            } else {
                document.getElementById('loginOverlay').style.display = 'flex';
                listenToLeaderboard();
            }
        };

    
        function loginUser() {
            const inputName = document.getElementById('usernameInput').value.trim();
            const inputPin = document.getElementById('pinInput').value.trim();

            if(!inputName || !inputPin) {
                alert("الرجاء إدخال الاسم والرقم السري!");
                return;
            }

            const userRef = db.collection("students").doc(inputName);
            
            userRef.get().then((doc) => {
                if (doc.exists) {
                    const userData = doc.data();
                    if(userData.pin === inputPin) {
                        enterApp(inputName);
                    } else {
                        alert("⛔ هذا الاسم محجوز والرقم السري غير صحيح!\nإذا كنت أنت صاحب الاسم، تأكد من الـ PIN.\nإذا كنت مستخدم جديد، اختر اسماً آخر.");
                    }
                } else {
                
                    if(confirm(`هل تريد إنشاء حساب جديد باسم "${inputName}" ورقم سري "${inputPin}"؟\nتذكر الرقم السري جيداً!`)) {
                        userRef.set({
                            name: inputName,
                            pin: inputPin, 
                            totalSeconds: 0,
                            lastStudy: firebase.firestore.FieldValue.serverTimestamp()
                        }).then(() => {
                            enterApp(inputName);
                        });
                    }
                }
            }).catch((error) => {
                console.error("Error checking user:", error);
                alert("حدث خطأ في الاتصال، حاول مرة أخرى.");
            });
        }

        function enterApp(username) {
            currentUser = username;
            localStorage.setItem('wiueni_global_user', currentUser);
            initializeUser(currentUser);
            document.getElementById('loginOverlay').style.display = 'none';
        }

        function logoutUser() {
            if(confirm("هل تريد تسجيل الخروج؟")) {
                localStorage.removeItem('wiueni_global_user');
                location.reload();
            }
        }

        async function initializeUser(username) {
    document.getElementById('displayName').innerText = username;
    docRef = db.collection("students").doc(username);

    try {
        const systemRef = db.collection("settings").doc("global_status");
        const systemDoc = await systemRef.get();
        const now = new Date();
        const todayDateString = now.toDateString(); 

        if (systemDoc.exists) {
            const systemData = systemDoc.data();
            
            if (systemData.lastResetDate !== todayDateString) {
                console.log("تاريخ النظام قديم.. جاري تصفير قاعدة البيانات للكل 🚨");

          
                const allStudents = await db.collection("students").get();
                const batch = db.batch();
                allStudents.forEach((s) => {
                    batch.update(s.ref, { totalSeconds: 0 });
                });
                await batch.commit();

                await systemRef.update({ lastResetDate: todayDateString });
            }
        } else {
            
            await systemRef.set({ lastResetDate: todayDateString });
        }

       
        const userDoc = await docRef.get();
        if (userDoc.exists) {
            totalSecondsStudied = userDoc.data().totalSeconds || 0;
        }
        
        renderTotalTime();
    } catch (error) {
        console.error("حدث خطأ:", error);
    }

    listenToLeaderboard();
    loadLocalData(username);
}
    db.collection("students")
        .orderBy("totalSeconds", "desc")
        .limit(5) 
        .onSnapshot((querySnapshot) => {
            const listElement = document.getElementById('leaderboardList');
            if (!listElement) return;
            listElement.innerHTML = "";
            
            const now = new Date();
            let rank = 1;

            querySnapshot.forEach((doc) => {
                const student = doc.data();
                const lastStudyDate = student.lastStudy ? student.lastStudy.toDate() : null;

             
                const isToday = lastStudyDate && 
                                lastStudyDate.getDate() === now.getDate() &&
                                lastStudyDate.getMonth() === now.getMonth() &&
                                lastStudyDate.getFullYear() === now.getFullYear();

                
                let displaySeconds = isToday ? (student.totalSeconds || 0) : 0;

                if (displaySeconds <= 0) {
                    return; 
                }

                const isMe = (student.name === currentUser);
                
                let rankIcon = rank;
                if(rank === 1) rankIcon = "🥇";
                if(rank === 2) rankIcon = "🥈";
                if(rank === 3) rankIcon = "🥉";

                const li = document.createElement('li');
                li.className = 'lb-item';
                if(isMe) li.style.border = "1px solid #F2EE14"; 
                
                li.innerHTML = `
                    <span class="lb-rank">${rankIcon}</span>
                    <span class="lb-name">${student.name} ${isMe ? '(أنت)' : ''}</span>
                    <span class="lb-time">${formatTime(displaySeconds)}</span>
                `;
                listElement.appendChild(li);
                rank++;
            });


            if (listElement.innerHTML === "") {
                listElement.innerHTML = "<li style='text-align:center; color:#888; font-size:0.8rem; padding:15px; background:rgba(255,255,255,0.02); border-radius:10px;'> </li>";
            }
        });


        function syncTimeToServer() {
            if(docRef) {
                docRef.set({
                    totalSeconds: totalSecondsStudied,
                    lastStudy: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
            }
        }

        function resetProgress() {
            if(confirm("هل تريد بدء يوم جديد وتصفير العدادات؟")) {
                totalSecondsStudied = 0;
                waterCount = 0;
                document.getElementById('todoList').innerHTML = "";
                
                if(docRef) {
                    docRef.update({ totalSeconds: 0 });
                }

                saveLocalData();
                renderTotalTime();
                document.getElementById('waterCups').innerText = "0 💧";
            }
        }

        function loadLocalData(username) {
            const waterKey = `wiueni_${username}_water`;
            const tasksKey = `wiueni_${username}_tasks`;
            if(localStorage.getItem(waterKey)) waterCount = parseInt(localStorage.getItem(waterKey));
            document.getElementById('waterCups').innerText = waterCount + " 💧";
            if(localStorage.getItem(tasksKey)) {
                document.getElementById('todoList').innerHTML = localStorage.getItem(tasksKey);
                document.querySelectorAll('.delete-btn').forEach(btn => btn.setAttribute('onclick', 'deleteTask(event, this)'));
                document.querySelectorAll('.todo-item').forEach(item => item.setAttribute('onclick', 'toggleTask(this)'));
            }
        }

        function formatTime(totalSeconds) {
            if(!totalSeconds) return "0m";
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            if(hours > 0) return `${hours}h ${minutes}m`;
            return `${minutes}m`;
        }


        let isLocked = false; 

function toggleLock() {
    isLocked = !isLocked;
    const lockBtn = document.getElementById('lockBtn');
    const buttonsContainer = document.getElementById('timeButtonsContainer');
    
    if (isLocked) {
        lockBtn.innerText = "🔒";
        buttonsContainer.style.opacity = "0.5";

function setTime(minutes) {
    if (isLocked) return;

    selectedTime = minutes;
    timeLeft = minutes * 60;
    renderTime();

    document.querySelectorAll('.time-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.textContent == minutes) btn.classList.add('active');
    });
}










        function renderTime() { 
            const mins = Math.floor(timeLeft / 60); 
            const secs = Math.floor(timeLeft % 60); 
            document.getElementById('timerDisplay').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`; 
        }

        function renderTotalTime() {
            const hours = Math.floor(totalSecondsStudied / 3600);
            const minutes = Math.floor((totalSecondsStudied % 3600) / 60);
            let text = "";
            if (hours > 0) text += `${hours}h `;
            if (minutes > 0) text += `${minutes}m`;
            if (hours === 0 && minutes === 0) text = "0m";
            document.getElementById('totalFocusDisplay').innerText = text;
        }

        function toggleMute() {
            isMuted = !isMuted;
            const btn = document.getElementById('muteBtn');
            btn.innerText = isMuted ? "🔕" : "🔔";
            btn.classList.toggle('active', isMuted);
        }

        function playAlarm() {
            if (isMuted) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            const playNote = (freq, time) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, time);
                gain.gain.exponentialRampToValueAtTime(0.00001, time + 1.5);
                osc.start(time);
                osc.stop(time + 1.5);
            };
            const now = ctx.currentTime;
            playNote(523.25, now); playNote(659.25, now + 0.1); playNote(783.99, now + 0.2); playNote(1046.50, now + 0.3);
        }

        function toggleStudySession() {
            const btn = document.getElementById('studyBtn');
            const body = document.body;
            const lockBtn = document.getElementById('lockBtn');

            if (isTimerRunning) { 
                clearInterval(timerInterval); 
                isTimerRunning = false; 
                btn.innerText = "استئناف"; 
                body.classList.remove('zen-mode');
                bgVideo.pause();

                lockBtn.style.display = 'none';
                unlockTimeButtons();
                syncTimeToServer();
            } else { 
                isTimerRunning = true; 
                btn.innerText = "إيقاف مؤقت"; 
                body.classList.add('zen-mode');
                bgVideo.play();

                lockBtn.style.display = 'inline-block';
                lockTimeButtons();
                timerInterval = setInterval(() => { 
                    timeLeft--; 
                    renderTime(); 
                    totalSecondsStudied++;
                    renderTotalTime();
                    if(totalSecondsStudied % 10 === 0) syncTimeToServer();

                    if (timeLeft <= 0) { 
                        clearInterval(timerInterval); 
                        playAlarm(); 
                        confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 }, colors: ['#F2EE14', '#ffffff'], zIndex: 9999 });
                        alert("أحسنت! انتهت الجلسة 🎉"); 
                        toggleStudySession(); 
                        btn.innerText = "ابدأ جلسة جديدة"; 
                        timeLeft = selectedTime * 60;
                        renderTime();
                        syncTimeToServer(); 
                    } 
                }, 1000); 
            }
        }

        function handleEnter(e) { if (e.key === 'Enter') addTask(); }

        function addTask() {
            const input = document.getElementById('todoInput');
            const text = input.value.trim();
            if (text !== "") {
                const list = document.getElementById('todoList');
                const li = document.createElement('li');
                li.className = 'todo-item';
                li.onclick = function() { toggleTask(this); };
                li.innerHTML = `<div class="todo-content"><div class="custom-checkbox"></div><span>${text}</span></div><button class="delete-btn" onclick="deleteTask(event, this)">×</button>`;
                list.appendChild(li);
                input.value = "";
                saveLocalData();
            }
        }

        function toggleTask(li) {
            if (li.classList.contains('completed')) li.classList.remove('completed');
            else { li.classList.add('completed'); confetti({ particleCount: 60, spread: 50, origin: { y: 0.7 }, colors: ['#F2EE14'], zIndex: 9999 }); }
            saveLocalData();
        }

        function deleteTask(e, btn) {
            e.stopPropagation();
            btn.closest('li').remove();
            saveLocalData();
        }

        function addCup() { 
            waterCount++; 
            document.getElementById('waterCups').innerText = waterCount + " 💧"; 
            saveLocalData();
        }

        function saveLocalData() {
            if(!currentUser) return;
            localStorage.setItem(`wiueni_${currentUser}_water`, waterCount);
            localStorage.setItem(`wiueni_${currentUser}_tasks`, document.getElementById('todoList').innerHTML);
        }

        function lockTimeButtons() {
    isLocked = true;
    const lockBtn = document.getElementById('lockBtn');
    const container = document.querySelector('.time-buttons');
    if(lockBtn) lockBtn.innerText = "🔒";

function unlockTimeButtons() {
    isLocked = false;
