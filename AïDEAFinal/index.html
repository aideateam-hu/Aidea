<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AïDEA - Intelligence Starts with an Idea</title>
    <link rel="icon" href="media\logo.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Cairo', sans-serif; }
        body { background-color: #050505; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        
        #particles-js { position: fixed; width: 100%; height: 100%; z-index: 1; top: 0; left: 0; }
        nav, section, footer, .ai-assistant-social, .modal { position: relative; z-index: 2; }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            flex-direction: row-reverse; 
            background-color: rgba(0, 0, 0, 0.85);
            border-bottom: 1px solid #1a1a1a;
            backdrop-filter: blur(10px);
            position: sticky; 
            top: 0;
            z-index: 100;
        }
        .logo img { height: 50px; width: auto; display: block; }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a { color: #fff; text-decoration: none; font-weight: 700; transition: 0.3s; font-size: 1.1rem; margin: 0; position: relative; }
        .nav-links a:hover, .nav-links a.active { color: #F2EE14; text-shadow: 0 0 10px #f2ee14; }

        .hero { display: flex; flex: 1; align-items: center; justify-content: center; gap: 50px; padding: 50px 10%; min-height: 80vh; }
        .text-content { flex: 1; direction: ltr; text-align: left; }
        
        h1 { font-size: 4rem; line-height: 1.1; margin-bottom: 25px; font-weight: 900; font-family: 'Poppins', sans-serif; }
        .highlight { color: #F2EE14; text-shadow: 0 0 30px rgba(242, 238, 20, 0.4); }
        
        .cta-btn { 
            display: inline-block; 
            background-color: #F2EE14; 
            color: #000; 
            padding: 15px 40px; 
            border-radius: 12px; 
            text-decoration: none; 
            font-weight: 900; 
            font-size: 1.2rem; 
            transition: 0.3s; 
            box-shadow: 0 10px 20px rgba(242, 238, 20, 0.2); 
            font-family: 'Cairo', sans-serif; 
        }
        .cta-btn:hover { transform: scale(1.05); background-color: #fff; }

        .wiueni-wrapper { position: relative; display: inline-block; width: 300px; height: auto; flex-shrink: 0; }
        .wiueni-img { position: relative; z-index: 2; width: 100%; filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.5)); }
        .bulb-glow {
            position: absolute; width: 40px; height: 40px; background-color: #F2EE14; border-radius: 50%; z-index: 1;
            box-shadow: 0 0 40px 20px #F2EE14; filter: blur(10px); opacity: 0.8;
            top: 10%; left: 45%; animation: pulse-glow 2s infinite alternate;
        }
        @keyframes pulse-glow {
            from { opacity: 0.6; transform: scale(1); }
            to { opacity: 1; transform: scale(1.2); }
        }

        .majors-gallery { padding: 80px 20px; text-align: center; position: relative; z-index: 5; }
        .section-title { font-size: 2.5rem; font-weight: 900; margin-bottom: 40px; }
        
        .gallery-grid { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; margin-top: 40px; }

        .image-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 15px; width: 100%; max-width: 450px;
            cursor: pointer; transition: 0.3s ease;
        }
        .image-card:hover { transform: translateY(-10px); border-color: #F2EE14; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        .image-card h3 { margin-top: 15px; color: #fff; font-size: 1.2rem; }
        .image-card:hover h3 { color: #F2EE14; }

        .img-wrapper { width: 100%; height: 300px; overflow: hidden; border-radius: 15px; position: relative; }
        .img-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s ease; }
        .image-card:hover .img-wrapper img { transform: scale(1.1); }

        .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.4);
            display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.3s;
        }
        .image-card:hover .overlay { opacity: 1; }
        .zoom-icon { font-size: 2rem; background: rgba(242, 238, 20, 0.9); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        .modal {
            display: none; position: fixed; z-index: 9999; padding-top: 50px; left: 0; top: 0;
            width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.95); backdrop-filter: blur(5px);
            text-align: center; overflow-y: auto; /* للسماح بالتمرير إذا كانت الصورة طويلة */
        }
        .modal-content { margin: auto; display: block; max-width: 80%; max-height: 80vh; object-fit: contain; border-radius: 10px; box-shadow: 0 0 50px rgba(242, 238, 20, 0.2); animation: zoomIn 0.3s; }
        #caption { margin: 15px auto 10px; display: block; width: 80%; text-align: center; color: #F2EE14; font-size: 1.5rem; font-weight: bold; }
        
        .close-btn { 
            position: absolute; top: 20px; right: 40px; color: #fff; 
            font-size: 40px; font-weight: bold; cursor: pointer; transition: 0.3s; z-index: 10001; 
            background: rgba(0,0,0,0.5); width: 50px; height: 50px; line-height: 45px; border-radius: 50%;
        }
        .close-btn:hover { color: #F2EE14; background: rgba(255,255,255,0.1); }

        .download-btn {
            display: inline-block; background-color: #F2EE14; color: #000; padding: 10px 30px;
            border-radius: 50px; text-decoration: none; font-weight: 900; font-size: 1.1rem;
            margin-top: 10px; margin-bottom: 30px; transition: 0.3s; box-shadow: 0 0 15px rgba(242, 238, 20, 0.4); border: 2px solid #F2EE14;
        }
        .download-btn:hover { background-color: #000; color: #F2EE14; transform: scale(1.05); }

        @keyframes zoomIn { from {transform:scale(0)} to {transform:scale(1)} }

        .ai-assistant-social { position: fixed; bottom: 30px; left: 30px; width: 60px; height: 60px; z-index: 1000; display: flex; justify-content: center; align-items: center; }
        .brain-trigger { font-size: 35px; cursor: pointer; width: 65px; height: 65px; background: #000; border: 2px solid #F2EE14; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 15px rgba(242, 238, 20, 0.5); position: relative; z-index: 5; transition: transform 0.3s; -webkit-tap-highlight-color: transparent; }
        
        .social-orb { position: absolute; width: 45px; height: 45px; background: #222; border: 1px solid #555; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #fff; opacity: 0; transform: scale(0); transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 1; }
        .social-orb svg { width: 20px; height: 20px; }

        .social-orb.whatsapp:hover, .social-orb.whatsapp.active { background: #25D366; border-color: #25D366; box-shadow: 0 0 10px #25D366; }
        .social-orb.linkedin:hover, .social-orb.linkedin.active { background: #0077b5; border-color: #0077b5; box-shadow: 0 0 10px #0077b5; }
        .social-orb.facebook:hover, .social-orb.facebook.active { background: #1877F2; border-color: #1877F2; box-shadow: 0 0 10px #1877F2; }
        .social-orb.instagram:hover, .social-orb.instagram.active { background: #E1306C; border-color: #E1306C; box-shadow: 0 0 10px #E1306C; }
        .social-orb.telegram:hover, .social-orb.telegram.active { background: #0088cc; border-color: #0088cc; box-shadow: 0 0 10px #0088cc; }

        .ai-assistant-social:hover .brain-trigger, .ai-assistant-social.active .brain-trigger { transform: scale(1.1); box-shadow: 0 0 25px rgba(242, 238, 20, 0.8); }
        
        .ai-assistant-social:hover .social-orb.whatsapp, .ai-assistant-social.active .social-orb.whatsapp { transform: translate(15px,-90px) scale(1); opacity: 1; }
        .ai-assistant-social:hover .social-orb.facebook, .ai-assistant-social.active .social-orb.facebook { transform: translate(60px, -70px) scale(1); opacity: 1; }
        .ai-assistant-social:hover .social-orb.instagram, .ai-assistant-social.active .social-orb.instagram { transform: translate(90px, -30px) scale(1); opacity: 1; }
        .ai-assistant-social:hover .social-orb.linkedin, .ai-assistant-social.active .social-orb.linkedin { transform: translate(100px, 20px) scale(1); opacity: 1; }
        .ai-assistant-social:hover .social-orb.telegram, .ai-assistant-social.active .social-orb.telegram { transform: translate(-35px, -90px) scale(1); opacity: 1; }

        footer { text-align: center; padding: 30px; color: #555; background: #000; border-top: 1px solid #1a1a1a; margin-top: auto; }

        /* ---  Media  --- */
        @media (max-width: 768px) { 

    nav { 
        padding: 10px 15px !important; 
        flex-direction: row-reverse !important;

        background-color: #000 !important; 
        gap: 5px !important;
    }

    .logo img { 
        height: 22px !important; 
    }

    .nav-links { 
        display: flex !important;
        width: auto !important;

        flex-wrap: nowrap !important; 
    }

    .nav-links a {
        font-size: 0.75rem !important;

    }

}

            .hero { 
                flex-direction: column-reverse !important; 
                padding: 100px 20px 40px !important; 
                gap: 30px; 
                text-align: center; 
                min-height: auto;
            }
            .text-content { 
                text-align: center; 
                direction: rtl; 
            }
            h1 { font-size: 2.2rem; margin-bottom: 15px; }
            h1 br { display: none; } 
            
            .wiueni-wrapper { width: 60%; max-width: 200px; margin: 0 auto; }
            
            .gallery-grid { gap: 20px; }
            .image-card { width: 100%; max-width: 100%; }
            .img-wrapper { height: 220px; }
            
            .modal { padding-top: 80px; }
            .modal-content { width: 95%; max-width: 95%; }
            .close-btn { 
                top: 15px; right: 20px; 
                font-size: 30px; width: 40px; height: 40px; line-height: 38px;
            }
            #caption { font-size: 1.2rem; }

            .ai-assistant-social { left: 20px; bottom: 20px; }
        }
    </style>
</head>

    <script>
        
        particlesJS('particles-js', { "particles": { "number": { "value": 80 }, "color": { "value": "#F2EE14" }, "opacity": { "value": 0.3 }, "size": { "value": 3 }, "line_linked": { "enable": true, "color": "#F2EE14", "opacity": 0.15 }, "move": { "enable": true, "speed": 1.5 } } });

        function openModal(imageSrc, captionText) {
            var modal = document.getElementById("imageModal");
            var modalImg = document.getElementById("img01");
            var caption = document.getElementById("caption");
            var downloadBtn = document.getElementById("downloadBtn");
            
            modal.style.display = "block";
            modalImg.src = imageSrc;
            caption.innerHTML = captionText;
            
            downloadBtn.href = imageSrc;
            downloadBtn.download = "AIDEA_Plan_" + captionText; 
        }

        function closeModal() {
            document.getElementById("imageModal").style.display = "none";
        }

        window.onclick = function(event) {
            var modal = document.getElementById("imageModal");
            if (event.target == modal) {
                modal.style.display = "none";
            }
            var socialMenu = document.getElementById('socialMenu');
            if (!socialMenu.contains(event.target)) {
                socialMenu.classList.remove('active');
            }
        }

        function toggleSocialMenu() {
            var menu = document.getElementById('socialMenu');
            menu.classList.toggle('active');
        }
    </script>
